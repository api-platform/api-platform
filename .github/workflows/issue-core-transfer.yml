name: Transfer core issues

# Issues about the framework itself belong to api-platform/core. Claude only
# classifies, with read-only tools: the issue body is untrusted input, so the
# transfer is done by a plain step that can only move this issue to core.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to classify
        required: true
        type: number
      dry_run:
        description: Only report the decision, never transfer
        type: boolean
        default: true

permissions:
  contents: read
  issues: read

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue }}

jobs:
  classify:
    if: github.event.issue.user.type != 'Bot'
    permissions:
      contents: read
      issues: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: api-platform/core
          path: core

      - name: Load the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json title,body --jq '"# " + .title + "\n\n" + .body' > "$RUNNER_TEMP/issue.md"

      - name: Mint the OIDC token for the Claude API
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/oidc-token`, token, { mode: 0o600 });

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - run: pip install anthropic==2.6.0

      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc-token
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          decision=$(python .github/scripts/classify-issue.py "$RUNNER_TEMP/issue.md")
          echo "#$ISSUE: $decision" | tee -a "$GITHUB_STEP_SUMMARY"

      - if: steps.classify.outputs.action != 'none' && !inputs.dry_run
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.API_PLATFORM_APP_ID }}
          private-key: ${{ secrets.API_PLATFORM_APP_PRIVATE_KEY }}
          owner: api-platform
          repositories: api-platform,core
          permission-issues: write

      - if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTION: ${{ steps.classify.outputs.action }}
          DUPLICATE_OF: ${{ steps.classify.outputs.duplicate_of }}
        run: |
          state=$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" != OPEN ]; then
            echo "#$ISSUE is $state, leaving it alone."
            exit 0
          fi
          if [ "$ACTION" = close_duplicate ]; then
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Duplicate of api-platform/core#$DUPLICATE_OF."
            gh issue close "$ISSUE" -R "$GITHUB_REPOSITORY" --reason duplicate
          else
            gh issue transfer "$ISSUE" api-platform/core -R "$GITHUB_REPOSITORY"
          fi
