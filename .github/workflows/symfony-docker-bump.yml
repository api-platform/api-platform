name: symfony-docker bump

# The pin in SymfonyScaffold stays a SHA: those files run on user machines, so
# every bump goes through a reviewed PR. The PR is pushed with the
# api-platform-release-manager app token so CI and E2E run on it, and
# auto-merge lands it once a maintainer approves.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: ~
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: symfony-docker-bump-${{ github.event_name }}
  cancel-in-progress: false

env:
  UPSTREAM: dunglas/symfony-docker
  BRANCH_PREFIX: automation/symfony-docker-pin-

jobs:
  bump:
    name: Open the bump PR
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.API_PLATFORM_APP_ID }}
          private-key: ${{ secrets.API_PLATFORM_APP_PRIVATE_KEY }}
          owner: api-platform
          repositories: api-platform

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: Compare the pin against upstream main
        id: compare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          current=$(php scripts/symfony-docker-pin.php ref)
          latest=$(gh api "repos/$UPSTREAM/commits/main" --jq .sha)
          branch="$BRANCH_PREFIX${latest:0:7}"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          if [ "$current" = "$latest" ]; then
            echo "Already pinned to $latest."
            exit 0
          fi

          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "A PR for $latest is already open."
            exit 0
          fi

          gh api "repos/$UPSTREAM/compare/$current...$latest" > compare.json

          # Upstream churns on docs, CI and devcontainer docs we never copy.
          # Only the files the scaffold actually installs justify a PR.
          jq -r '.files[].filename' compare.json | php scripts/symfony-docker-pin.php filter > copied-changes.txt

          if [ ! -s copied-changes.txt ]; then
            echo "$UPSTREAM is at $latest but no copied file changed; leaving the pin alone."
            exit 0
          fi

          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Write the PR body
        if: steps.compare.outputs.changed
        env:
          CURRENT: ${{ steps.compare.outputs.current }}
          LATEST: ${{ steps.compare.outputs.latest }}
        run: |
          jq -r --rawfile copied copied-changes.txt '
            ($copied | split("\n") | map(select(. != ""))) as $c
            | .files[] | select(.filename as $f | $c | index($f))
            | "<details><summary><code>\(.filename)</code></summary>\n\n```diff\n\(.patch // "No patch available, see the upstream diff.")\n```\n\n</details>\n"
          ' compare.json > patches.md

          # GitHub rejects PR bodies above 65536 characters.
          if [ "$(wc -c < patches.md)" -gt 55000 ]; then
            echo 'The patches are too large to inline, see the upstream diff.' > patches.md
          fi

          {
            echo "Bumps the pinned [\`$UPSTREAM\`](https://github.com/$UPSTREAM) commit from \`${CURRENT:0:7}\` to \`${LATEST:0:7}\` ([upstream diff](https://github.com/$UPSTREAM/compare/$CURRENT...$LATEST))."
            echo
            echo '### Upstream commits'
            echo
            jq -r '.commits[] | "- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0])"' compare.json
            echo
            echo '### Changes to the files the scaffold copies'
            echo
            cat patches.md
            echo
            echo 'These files run on user machines. Auto-merge is enabled: approving lands the PR once CI and E2E pass.'
          } > pr-body.md

      - name: Open the PR
        if: steps.compare.outputs.changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          LATEST: ${{ steps.compare.outputs.latest }}
          BRANCH: ${{ steps.compare.outputs.branch }}
        run: |
          php scripts/symfony-docker-pin.php pin "$LATEST"

          bot_id=$(gh api "users/$APP_SLUG[bot]" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$bot_id+$APP_SLUG[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore(installer): bump symfony-docker to ${LATEST:0:7}"
          git push origin "$BRANCH"

          pr=$(gh pr create --head "$BRANCH" --base main \
            --title "chore(installer): bump symfony-docker to ${LATEST:0:7}" \
            --body-file pr-body.md)
          gh pr merge --auto --squash "$pr"

          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"$BRANCH_PREFIX\")) | select(.headRefName != \"$BRANCH\") | .number" \
            | while read -r old; do
                gh pr close "$old" --delete-branch --comment "Superseded by $pr."
              done

  release-reminder:
    name: Ask for a release
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'automation/symfony-docker-pin-')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # Created with GITHUB_TOKEN on purpose: it does not fire `issues: opened`,
      # so issue-core-transfer leaves this issue alone.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Release needed: $TITLE" \
            --body "#$PR changed the symfony-docker pin. The installer bakes the pin into its binary, so users only get it with a new tag."
